# Tek sayfa uygulaması (SPA) sunucusu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite dosya adlarına içerik özeti ekler; değişmeyen dosya uzun süre önbellekte kalabilir.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /urun/... ya da /hesabim/siparisler gibi adresler sunucuda dosya değildir; yönlendirmeyi
    # React Router yapar. Dosya yoksa index.html dönülür, yoksa sayfa yenilenince 404 alınır.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
