# Tek sayfa uygulaması (SPA) sunucusu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Güvenlik başlıkları. Bir location bloğu kendi add_header'ını tanımlarsa sunucu düzeyindekiler o
    # blokta geçersiz olur; bu yüzden ortak dosya her blokta yeniden ekleniyor.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite dosya adlarına içerik özeti ekler; değişmeyen dosya uzun süre önbellekte kalabilir.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Bulunmayan dosya için index.html dönmek tarayıcıda anlaşılmaz hatalara yol açıyordu
    # (ör. eksik bir .js dosyası yerine HTML geliyordu). Artık düz 404 dönülüyor.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
