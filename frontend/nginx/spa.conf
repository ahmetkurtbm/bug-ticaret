# Tek sayfa uygulaması (SPA) sunucusu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Güvenlik başlıkları. Bir location bloğu kendi add_header'ını tanımlarsa sunucu düzeyindekiler o
    # blokta geçersiz olur; bu yüzden ortak dosya her blokta yeniden ekleniyor.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite dosya adlarına içerik özeti ekler; değişmeyen dosya uzun süre önbellekte kalabilir.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # /urun/... ya da /hesabim/siparisler gibi adresler sunucuda dosya değildir; yönlendirmeyi
    # React Router yapar. Dosya yoksa index.html dönülür, yoksa sayfa yenilenince 404 alınır.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
