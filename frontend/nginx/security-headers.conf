add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# API ve görseller dış adreslerden gelir; geri kalan her şey aynı kaynaktan.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://picsum.photos https://fastly.picsum.photos; connect-src 'self' http://localhost:5080; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
